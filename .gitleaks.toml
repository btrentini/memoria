# Keep the full upstream ruleset. Cargo manifests contain SHA-256 integrity
# hashes; these are verified independently by Scripts/verify-vendor.py.
[extend]
useDefault = true

[[allowlists]]
description = "Verified Cargo checksum values only"
condition = "AND"
paths = ['''(^|/)Worker/vendor/[^/]+/\.cargo-checksum\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']
